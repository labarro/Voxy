name: Validar Voxy nativo experimental
on:
  push:
    branches: ["migration/**"]
  pull_request:
    paths: ["native/**", "infra/signaling/**", "scripts/native.ps1", ".github/workflows/native.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Preparar Rust e CMake
        shell: pwsh
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
          cmake --version
      - name: Formato, Clippy e testes Rust
        working-directory: native
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --workspace
      - name: Testar Worker e dois processos Rust sem serviço externo
        run: |
          npm ci --prefix infra/signaling --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check --prefix infra/signaling
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test --prefix infra/signaling
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:native --prefix infra/signaling
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:host --prefix infra/signaling
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Compile first: the session harness gives the running tests 180 s, and a cold
          # runner needs longer than that just to build this test binary.
          Push-Location native
          cargo test --locked -p voxy-cli --test session_live --no-run
          $built = $LASTEXITCODE
          Pop-Location
          if ($built -ne 0) { exit $built }
          npm run test:session --prefix infra/signaling
      - name: Conferir origem das fixtures diferenciais dos jogos
        run: node evidence/native-2.0/functional/verify-game-oracles.mjs
      - name: Compilar os executáveis nativos otimizados
        working-directory: native
        run: cargo build --locked --release --workspace
      - name: Preparar ZIP experimental em execução manual
        if: github.event_name == 'workflow_dispatch'
        run: ./scripts/package-native.ps1 -SkipBuild -SkipInstaller
      - name: Guardar pacote experimental para revisão
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: voxy-native-experimental-windows-x64
          path: |
            release/*/native-experimental/*.zip
            release/*/native-experimental/artifacts.json
            release/*/native-experimental/packaged-probes.json
          if-no-files-found: error
          retention-days: 7
      # Deliberately no release, deployment, signing secret or stable updater step.
